[package]
name = "librustee"
version = "0.0.1"
edition = "2024"

[dependencies]
backtrace = "0.3.76"
capstone = "0.14.0"
colored = "3.1.1"
cranelift-codegen = "0.132.0"
cranelift-frontend = "0.132.0"
cranelift-jit = "0.132.0"
cranelift-module = "0.132.0"
cranelift-native = "0.132.0"
cranelift-object = "0.132.0"
goblin = "0.10.7"
libc = "0.2.186"
lru = "0.18.0"
mipsasm = { path = "../external/mipsasm" }
nix = { version = "0.31.3", features = ["signal", "mman", "feature"] }
region = "3.0.2"
target-lexicon = "0.13.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
once_cell = "1.21.4"
regex = "1.12.3"
portable-atomic = "1.13.1"
wgpu = "29.0.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "mman", "fs"] }

[dev-dependencies]
criterion = "0.8.2"
